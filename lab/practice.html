<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>직접 해 보기 실험실 · Docent</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/practice.css">
  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
    .lab { max-width: 48rem; margin: 0 auto; padding: var(--s-8) var(--s-5) var(--s-9); }
    .lab-head { margin-bottom: var(--s-8); padding-bottom: var(--s-6); border-bottom: 1px solid var(--rule); }
    .lab-head h1 { margin: 0; font-size: var(--text-h3); font-weight: 720; letter-spacing: var(--tracking-tight); }
    .lab-head p { margin: var(--s-3) 0 0; color: var(--ink-2); font-size: var(--text-sm); line-height: 1.75; }
    .lab-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-4); margin-top: var(--s-4); color: var(--ink-3); font-size: var(--text-sm); }
    .lab-tools a, .lab-tools button { color: var(--accent-ink); text-underline-offset: 3px; }
    .lab-tools a[aria-current="page"] { color: var(--ink); font-weight: 650; text-decoration: none; }
    .lab-tools button { padding: 0; border: 0; background: none; font: inherit; text-decoration: underline; cursor: pointer; }
    .lab-tools a:focus-visible, .lab-tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
    .lab-status { margin: var(--s-2) 0 0; color: var(--ink-3); font-size: var(--text-xs); line-height: 1.7; }
    @media (max-width: 640px) { .lab { padding: var(--s-6) var(--s-4) var(--s-8); } }
  </style>
</head>
<body>
  <main class="lab">
    <header class="lab-head">
      <h1>직접 해 보기 실험실</h1>
      <p>레슨 끝에 붙는 ‘직접 해 보기’만 따로 띄운 페이지예요. 주제를 바꿔 보고, 코드를 실행하고 채점한 뒤, 힌트와 AI 도우미까지 차례로 시험해 볼 수 있어요.</p>
      <div class="lab-tools">
        <span>AI 도우미</span>
        <a href="practice.html" data-mode="auto">자동 연결</a>
        <a href="practice.html?ai=off" data-mode="off">끄고 보기</a>
        <a href="practice.html?ollama=http://127.0.0.1:11435" data-mode="fail">연결 실패 흉내</a>
        <button type="button" id="lab-reset">진행 기록 지우기</button>
      </div>
      <p class="lab-status" id="lab-python" aria-live="polite">파이썬: 아직 불러오지 않았어요. 처음 실행할 때 불러와요.</p>
      <p class="lab-status" id="lab-ai">AI 도우미: 확인하는 중이에요.</p>
    </header>

    <section class="blk practice" id="practice" data-practice="variables">
      <p>직접 해 보기는 JavaScript가 켜져 있어야 동작해요.</p>
    </section>
  </main>

  <script type="module">
    import { mountPractice } from '../src/practice/practice.js';
    import { getRunner, PYODIDE_VERSION } from '../src/practice/runner.js';

    const params = new URLSearchParams(location.search);
    const endpoint = params.get('ollama');
    const mode = params.get('ai') === 'off' ? 'off' : endpoint ? 'fail' : 'auto';
    document.querySelector(`.lab-tools a[data-mode="${mode}"]`)?.setAttribute('aria-current', 'page');

    const pythonStatus = document.getElementById('lab-python');
    getRunner().addEventListener('state', ({ detail }) => {
      const text = {
        loading: `파이썬: Pyodide ${PYODIDE_VERSION}을 불러오는 중이에요.`,
        ready: `파이썬: Pyodide ${detail.version} · Python ${detail.python} 준비됐어요.`,
        failed: '파이썬: 불러오지 못했어요. 인터넷 연결을 확인해 주세요.',
        idle: '파이썬: 오래 걸린 실행을 멈추고 다시 준비하고 있어요.',
      }[detail.state];
      if (text) pythonStatus.textContent = text;
    });

    const ai = mode === 'off' ? false : endpoint ? { endpoint, probe: 'always' } : undefined;
    const practice = await mountPractice(document.getElementById('practice'), {
      lessonId: 'variables',
      dataUrl: '../content/practice/variables.json',
      ai,
    });

    document.getElementById('lab-reset').addEventListener('click', () => practice.resetProgress());
    await practice.aiReady;
    const status = practice.ai;
    document.getElementById('lab-ai').textContent = status.mode === 'live'
      ? `AI 도우미: 이 컴퓨터의 ${status.model} 모델과 연결됐어요.`
      : mode === 'off'
        ? 'AI 도우미: 꺼 둔 상태예요.'
        : 'AI 도우미: 연결할 수 있는 로컬 모델이 없어서 힌트 모드로 보여 줘요.';
  </script>
</body>
</html>
